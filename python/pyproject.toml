[build-system]
requires = [
    "setuptools>=75.3.4; python_version < '3.9'",
    "setuptools>=82.0.1; python_version >= '3.9' and python_version < '3.10'",
    "setuptools>=84.2.1; python_version >= '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "chaincrafter"
version = "0.2.4"
authors = [
    { name="Rudolf Olah", email="rudolf.olah.to@gmail.com" },
]
description = "Seamless integration and composability for large language model apps."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.0.3; python_version < '3.9'",
    "pandas>=2.3.3; python_version >= '3.9' and python_version < '3.11'",
    "pandas>=3.1.1; python_version >= '3.11'",
    "numpy<2; python_version < '3.9'",
    "PyYAML>=6.0.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Other/Nonlisted Topic",
]
keywords = ["machine learning", "ai", "openai", "llama", "ml", "gpt-4", "gpt-3.5"]

[project.optional-dependencies]
openai = [
    "openai>=2.2.0,<2.3; python_version < '3.9'",
    "openai>=2.48.0; python_version >= '3.9' and python_version < '3.10'",
    "openai>=3.48.0; python_version >= '3.10'",
]

[tool.setuptools.packages.find]
include = ["chaincrafter*"]

[project.urls]
"Homepage" = "https://rudolfolah.github.io/chaincrafter/"
"Bug Tracker" = "https://github.com/rudolfolah/chaincrafter/issues"
"Repository" = "https://github.com/rudolfolah/chaincrafter"