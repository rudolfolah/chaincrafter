name: Python

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the built wheel with the OpenAI integration
        run: python -m pip install "$(echo dist/*.whl)[openai]"
      - name: Test the installed package outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/python/tests" -v
      - run: python -m pip check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --upgrade -r docs/requirements.txt
      - run: python -m mkdocs build --strict --config-file docs/docs/mkdocs.yml
